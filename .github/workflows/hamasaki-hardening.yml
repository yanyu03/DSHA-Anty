name: Hamasaki hardening regression
on:
  push:
    branches: [hamasaki]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tools
      - name: Run hardening contracts
        run: python3 -m unittest discover -s scripts -p test_hamasaki_hardening.py -v
      - name: Check framework safety regressions
        run: python3 -m unittest discover -s scripts -p test_hamasaki_identity.py -v
